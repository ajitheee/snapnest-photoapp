
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: photoapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: photoapp
      POSTGRES_PASSWORD: photoapp
      POSTGRES_DB: photoapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - photoapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoapp -d photoapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: photoapp-redis
    restart: unless-stopped
    networks:
      - photoapp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: photoapp-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://photoapp:photoapp@postgres:5432/photoapp
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      UPLOAD_PATH: /uploads
      THUMBNAIL_PATH: /thumbnails
      ML_SERVICE_URL: http://ml:3003
      S3_ENDPOINT: ${S3_ENDPOINT:-http://172.19.0.1:9000}
      S3_BUCKET: ${S3_BUCKET:-photoapp}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://192.168.86.170:8090}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.86.170:8090}
      # Google OAuth2 (optional — set to enable)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Generic OIDC / Authentik (optional — set to enable)
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
      - upload_data:/uploads
      - thumbnail_data:/thumbnails
    networks:
      - photoapp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: photoapp-web
    restart: unless-stopped
    networks:
      - photoapp
    depends_on:
      - api
    ports:
      - "4000:3000"

  ml:
    build:
      context: ./apps/ml
      dockerfile: Dockerfile
    container_name: photoapp-ml
    restart: unless-stopped
    environment:
      ML_DEVICE: cpu
      HF_HOME: /model-cache/huggingface
      INSIGHTFACE_HOME: /model-cache/insightface
    volumes:
      - ml_models:/model-cache
      - upload_data:/uploads:ro
      - thumbnail_data:/thumbnails:ro
    networks:
      - photoapp
    ports:
      - "3003:3003"

  nginx:
    image: nginx:1.25-alpine
    container_name: photoapp-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - photoapp
    depends_on:
      - api
      - web
      - ml

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: photoapp-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - photoapp
    depends_on:
      - api
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: photoapp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://192.168.86.170:3002
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - photoapp
    depends_on:
      - prometheus
    ports:
      - "3002:3000"

volumes:
  postgres_data:
  upload_data:
  thumbnail_data:
  ml_models:
  prometheus_data:
  grafana_data:

networks:
  photoapp:
    driver: bridge
